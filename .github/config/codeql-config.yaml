name: "Akeyless Secrets Operator CodeQL config"

# https://docs.github.com/en/code-security/code-scanning/managing-your-code-scanning-configuration/codeql-query-suites
queries:
  - uses: security-extended

query-filters:
  # Matches on identifier names (Secret, Key, Token, ...) and flags plain string
  # constants such as condition reasons and enum values, not real credentials.
  - exclude:
      id: go/hardcoded-credentials

paths-ignore:
  - "vendor/**"
  - "examples/**"
  - "tests/**"
  - "test/**"
  - "e2e/**"
  - "**/*_test.go"
  # Upstream providers that this fork does not register (see pkg/register/) and
  # that are therefore never compiled into the operator image. Their go/weak-
  # sensitive-data-hashing matches are SHA-256 cache keys, not password storage.
  # Remove an entry here if the provider is ever added to pkg/register/.
  - "providers/v1/yandex/**"
  - "providers/v1/nebius/**"
  - "providers/v1/infisical/**"
