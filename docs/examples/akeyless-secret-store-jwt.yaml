apiVersion: secrets.akeyless.io/v1alpha1
kind: AkeylessSecretStore
metadata:
  name: akeyless-jwt
  namespace: my-app
spec:
  akeylessGWApiURL: "https://api.akeyless.io"
  auth:
    jwtAuth:
      accessID: "p-xxxxxx"
      # Option A: JWT stored in a Secret (IdP-issued access/ID token)
      secretRef:
        name: akeyless-jwt
        key: token
      # Option B: mint a Kubernetes ServiceAccount token via TokenRequest instead
      # (use exactly one of secretRef / serviceAccountRef)
      # serviceAccountRef:
      #   name: akeyless-jwt-sa
      #   audiences:
      #     - "akeyless.io"   # required; must match the Akeyless auth method audience
      # expirationSeconds: 600
